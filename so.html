<!DOCTYPE html>
<html lang="en">
<head>
    <title>Companion Live Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
        .data-box { border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .value { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="data-box">
        Input 1 Fader: <span id="fader1" class="value">Loading...</span>
    </div>

    <script>
       async function getFader() {
    try {
        // Use the exact URL that gave you the '0'
        const response = await fetch('http://192.168.20.100:8000/api/variable/CR_BM_Switcher/audio_input_1_faderGain/value');
        
        // Use .text() because the response is just the number 0
        const data = await response.text();
        
        document.getElementById('fader1').innerText = data;
    } catch (err) {
        console.error("Connection failed. Check if CORS is enabled in Protocols tab.", err);
    }
}
    </script>
</body>
</html>
