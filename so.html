<!DOCTYPE html>
<html lang="en">
<head>
    <title>Companion Live Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
        .data-box { border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .value { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="data-box">
        Input 1 Fader: <span id="fader1" class="value">Loading...</span>
    </div>

    <script>
        async function updateDashboard() {
    try {
        const response = await fetch('http://192.168.20.100:8000/api/variable/CR_BM_Switcher/audio_input_1_faderGain/value');
        const data = await response.json();
        
        console.log(data); // This will show you the exact structure in the browser console

        // If the API returns { "value": "some-text" }, use data.value
        // If it returns a simple string, just use data
        document.getElementById('fader1').innerText = data.value !== undefined ? data.value : data;
    } catch (err) {
        document.getElementById('fader1').innerText = "Error Connecting";
        console.error("Fetch error:", err);
    }
}
    </script>
</body>
</html>
